<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&P — Roster Reset Fall 2026</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyCr-bhnnvBS-0JEuMOYThDPel-RbhjsmX8",
    authDomain: "presence-performance.firebaseapp.com",
    projectId: "presence-performance",
    storageBucket: "presence-performance.firebasestorage.app",
    messagingSenderId: "193097058616",
    appId: "1:193097058616:web:c9fb1c04e1d734748799cd"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window._db = db;
  window._fns = { doc, getDoc, setDoc };
  window._fbReady = true;
  window.dispatchEvent(new Event('fb-ready'));
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:#f0faf0;padding:1rem;max-width:680px;margin:0 auto;color:#1a3a1a}
h1{color:#2d7a2d;font-size:20px;margin-bottom:.5rem}
.card{background:#fff;border-radius:12px;padding:1.25rem;margin-bottom:1rem;border:1px solid #a8d5a8}
.btn{padding:12px 24px;font-size:14px;font-weight:700;border-radius:8px;cursor:pointer;border:none;color:#fff;width:100%;margin-top:.5rem}
.green{background:linear-gradient(135deg,#1f5e1f,#2d7a2d)}
.msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-top:.75rem}
.ok{background:#dcfce7;color:#166534}
.inf{background:#e8f5e8;color:#1f5e1f}
.err{background:#fee2e2;color:#991b1b}
.log{background:#1a1a1a;color:#4ade80;font-family:monospace;font-size:12px;padding:1rem;border-radius:8px;margin-top:1rem;max-height:400px;overflow-y:auto;white-space:pre-wrap}
progress{width:100%;height:10px;border-radius:5px;margin-top:.5rem}
</style>
</head>
<body>
<div class="card">
  <h1>Roster Reset — Fall 2026</h1>
  <p style="font-size:13px;color:#5a8a5a;margin-top:.25rem">Clears old semester roster for CENG 335 Sections 5 and 6, and adds today's attending students. Section 7 is left unchanged until you run a class there.</p>
</div>
<div class="card">
  <div id="status" class="msg inf">⏳ Ready — click Start to update the roster.</div>
  <progress id="prog" value="0" max="100" style="display:none;margin-top:.75rem"></progress>
  <button class="btn green" onclick="runReset()" id="btn">▶ Reset Roster for Fall 2026</button>
</div>
<div class="card">
  <div class="log" id="log">Waiting...\n</div>
</div>
<script>
const SEC5_NEW = {"242-027-047": "Nahal Krishno Saha", "242-028-047": "Wise Sinha", "242-056-047": "MD.tauficul islam", "242-085-047": "Md. Rahul Amin", "242-087-047": "Muhammad atiqurrahman", "242-231-047": "Khadija Akter", "242-258-047": "MD Tozammel Haque", "242-259-047": "Mohammad Mohashin Mia", "242-260-047": "Md. Nazrul Islam", "242-617-047": "MD Shafiqul Islam", "242-618-047": "MD JASHIM UDDIN", "243-184-047": "Kamrul Hasan"};
const SEC6_NEW = {"233-052-047": "Md. Rakibul Islam Roni", "242-017-047": "Mahmuda Sultana", "242-147-047": "Tamanna Khatun Joya", "242-161-047": "Rafiul Islam", "242-168-047": "Md. Rabby Islam", "242-210-047": "SARIF AHAMMED", "242-264-047": "MD Tamim Raza Prince", "242-346-047": "Md. Abul Hossain", "242-487-047": "Md. al-amin talukdar", "242-492-047": "Hridoy Mahbub Rinku", "242-625-047": "Roni Kumar Bhoumk"};

function log(t){const el=document.getElementById('log');el.textContent+=new Date().toLocaleTimeString()+' '+t+'\n';el.scrollTop=el.scrollHeight;}
function waitFb(){return new Promise(r=>{if(window._fbReady){r();return;}window.addEventListener('fb-ready',r,{once:true});setTimeout(r,5000);});}

async function runReset() {
  document.getElementById('btn').disabled = true;
  document.getElementById('btn').textContent = 'Running...';
  const prog = document.getElementById('prog');
  prog.style.display = 'block';
  await waitFb();
  const {doc, getDoc, setDoc} = window._fns;
  const db = window._db;

  log('Loading current settings from Firebase...');
  const settingsRef = doc(db, 'config', 'settings');
  const snap = await getDoc(settingsRef);
  if (!snap.exists()) { log('ERROR: Settings not found!'); return; }
  const settings = snap.data();
  const unis = JSON.parse(settings.universities);

  const pu = unis['PU'];
  const prog_name = 'B.Sc. Engineering (Civil)';
  const course = 'CENG 335: Design of Concrete Structure-II';

  // Clear old roster for Section 5 and replace with new students
  log('Clearing old Section 5 roster (' + Object.keys(pu.programs[prog_name].courses[course].roster['5']).length + ' old students)...');
  pu.programs[prog_name].courses[course].roster['5'] = SEC5_NEW;
  log('Added ' + Object.keys(SEC5_NEW).length + ' new Section 5 students.');
  prog.value = 33;

  // Clear old roster for Section 6 and replace with new students
  log('Clearing old Section 6 roster (' + Object.keys(pu.programs[prog_name].courses[course].roster['6']).length + ' old students)...');
  pu.programs[prog_name].courses[course].roster['6'] = SEC6_NEW;
  log('Added ' + Object.keys(SEC6_NEW).length + ' new Section 6 students.');
  prog.value = 66;

  // Clear Section 7 roster (new semester, no class yet)
  log('Clearing Section 7 roster (no class yet this semester)...');
  pu.programs[prog_name].courses[course].roster['7'] = {};
  prog.value = 80;

  // Save back to Firebase
  settings.universities = JSON.stringify(unis);
  await setDoc(settingsRef, settings);
  prog.value = 100;

  log('\n✅ Roster updated successfully!');
  log('Section 5: ' + Object.keys(SEC5_NEW).length + ' students');
  log('Section 6: ' + Object.keys(SEC6_NEW).length + ' students');
  log('Section 7: cleared (add students when first class runs)');
  log('\nClose this page and reload the main app.');

  document.getElementById('status').className = 'msg ok';
  document.getElementById('status').textContent = '✅ Roster reset complete for Fall 2026!';
  document.getElementById('btn').textContent = '✅ Done';
}
</script>
</body>
</html>
