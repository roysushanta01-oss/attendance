tAnswer": "C", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-06-27T16:26:03.051Z"}, {"QuestionID": "Q178257756369461391", "Question": "What is the correct sequence for a structural condition assessment workflow?", "OptionA": "LPR then Half-cell then Cover meter then Phenolphthalein then Visual survey", "OptionB": "Visual survey then Cover meter/GPR then Half-cell potential then Phenolphthalein plus AgNO3 then LPR", "OptionC": "Phenolphthalein then AgNO3 then Visual survey then Half-cell then LPR", "OptionD": "Cover meter then Visual survey then LPR then Half-cell then Phenolphthalein", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-06-27T16:26:03.694Z"}, {"QuestionID": "Q178257756394691922", "Question": "If tau-0 = 12 yr and alpha-TA = 0.25 and N-total/N-ref = 0.9125 what is the approximate effective tau-eff in the coupled degradation analysis?", "OptionA": "9.77 years", "OptionB": "10.45 years", "OptionC": "11.20 years", "OptionD": "8.50 years", "CorrectAnswer": "A", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-06-27T16:26:03.946Z"}, {"QuestionID": "Q178257756422524583", "Question": "What is the key engineering conclusion from comparing uncoupled (phiMn = 142.5 kNm) versus coupled (phiMn = 125.3 kNm) analysis for the bridge pier?", "OptionA": "Thermal cycling is the dominant deterioration mechanism", "OptionB": "Coupling interactions cause an additional 9.8% capacity loss beyond simple superposition showing single-mechanism assessments underpredict risk", "OptionC": "ASR alone is sufficient to cause structural failure of the pier", "OptionD": "Corrosion and ASR effects cancel each other out in coupled analysis", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-06-27T16:26:04.225Z"}, {"QuestionID": "Q178315171061379670", "Question": "What is the defining characteristic of a ductile failure mode in an RC member?", "OptionA": "Crack propagates suddenly across the full section without warning", "OptionB": "Steel yields first giving large visible deflections before collapse", "OptionC": "Diagonal tension crack forms at 45 degrees initiating near mid-depth", "OptionD": "Rebar slides relative to surrounding concrete at anchorage zones", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-04T07:55:10.613Z"}, {"QuestionID": "Q178315171074630451", "Question": "Which of the following correctly ranks the three RC failure modes from most to least ductile?", "OptionA": "Bond-slip then Shear then Flexure", "OptionB": "Shear then Flexure then Bond-slip", "OptionC": "Flexure then Shear then Bond-slip", "OptionD": "All three modes are equally ductile", "CorrectAnswer": "C", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-04T07:55:10.746Z"}, {"QuestionID": "Q178315171097813545", "Question": "Why does ACI 318 and BNBC 2020 assign a higher phi factor of 0.90 to flexure compared to 0.75 for shear?", "OptionA": "Flexural demand is always smaller than shear demand in practice", "OptionB": "Shear strength has higher variability and scatter so a larger safety margin is needed", "OptionC": "Flexural calculations are more complex and require more conservative values", "OptionD": "Stirrup spacing violations are more common than longitudinal bar violations", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-04T07:55:10.978Z"}, {"QuestionID": "Q178315171164949611", "Question": "In the Rana Plaza collapse what was the PRIMARY trigger that initiated progressive failure?", "OptionA": "Corrosion of longitudinal bars reducing Mn below the demand", "OptionB": "Inadequate lap splice lengths causing bond failure at floor junctions", "OptionC": "Rooftop diesel generator vibration imposing cyclic load on columns already carrying 160 to 180 percent of design load", "OptionD": "Unauthorized addition of three floors without structural re-analysis", "CorrectAnswer": "C", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-04T07:55:11.649Z"}, {"QuestionID": "Q178315171186215296", "Question": "How does deterioration (corrosion) shift the governing failure mode of an RC pier over time?", "OptionA": "Corrosion increases ductility by softening the steel", "OptionB": "Corrosion reduces Mn and Vn but Mn drops faster so shear may eventually govern", "OptionC": "Corrosion affects only the longitudinal bars so only Mn is reduced", "OptionD": "Corrosion reduces both Mn and Vn at the same rate so failure mode does not change", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-04T07:55:11.862Z"}, {"QuestionID": "Q178315177288349432", "Question": "Using the Whitney stress block for a singly reinforced rectangular section what is the stress block depth a?", "OptionA": "a = As times fy divided by (0.85 times fc prime times d)", "OptionB": "a = As times fy divided by (0.85 times fc prime times bw)", "OptionC": "a = 0.85 times beta1 times c", "OptionD": "a = Mu divided by (phi times As times fy)", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-04T07:56:12.883Z"}, {"QuestionID": "Q178315177326014046", "Question": "A pier with fc' = 25 MPa and fy = 415 MPa and As0 = 1256 mm2 and bw = 300 mm what is the nominal moment Mn of the original section?", "OptionA": "175.5 kNm", "OptionB": "195.0 kNm", "OptionC": "165.0 kNm", "OptionD": "213.3 kNm", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-04T07:56:13.260Z"}, {"QuestionID": "Q17831517741367517", "Question": "After 20 years of corrosion a pier has As = 886.7 mm2 to its original of 1276mm2. The corroded section gives phiMn = 139.4 kNm against Mu = 165.0 kNm. What is the engineering conclusion?", "OptionA": "The section is adequate with a 6.4 percent reserve", "OptionB": "The section is inadequate and flexural rehabilitation is required", "OptionC": "The section is adequate because shear still governs", "OptionD": "The section fails in bond-slip before reaching the flexural demand", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-04T07:56:14.136Z"}, {"QuestionID": "Q178315177433124027", "Question": "What is the purpose of the minimum steel ratio rho-min in ACI 318?", "OptionA": "To ensure the section reaches the tension-controlled strain limit", "OptionB": "To prevent sudden failure at first cracking by ensuring the section is stronger than the cracking moment", "OptionC": "To limit deflection under service loads", "OptionD": "To ensure adequate development length for longitudinal bars", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-04T07:56:14.331Z"}, {"QuestionID": "Q178315177454556695", "Question": "For the tension-controlled limit in ACI 318 what net tensile strain et must be achieved at nominal Mn?", "OptionA": "et greater than or equal to 0.003", "OptionB": "et greater than or equal to 0.004", "OptionC": "et greater than or equal to 0.005", "OptionD": "et greater than or equal to 0.010", "CorrectAnswer": "C", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-04T07:56:14.545Z"}, {"QuestionID": "Q178315180723346790", "Question": "At the neutral axis of a beam under transverse loading what is the state of stress that initiates a diagonal tension crack?", "OptionA": "Normal stress sigma is maximum and shear stress tau is zero", "OptionB": "Normal stress sigma is zero and shear stress tau is maximum \u2014 principal tensile stress acts at 45 degrees", "OptionC": "Both sigma and tau are equal and act at 90 degrees to the beam axis", "OptionD": "Compressive stress exceeds 0.85 fc prime causing crushing failure", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-04T07:56:47.233Z"}, {"QuestionID": "Q17831518073803079", "Question": "Which of the three shear transfer mechanisms in an RC beam is MOST sensitive to corrosion and lost FIRST when corrosion is active?", "OptionA": "Beam action (compression zone carrying shear) \u2014 approximately 40 percent of Vc", "OptionB": "Aggregate interlock (crack surface friction) \u2014 approximately 35 percent of Vc", "OptionC": "Dowel action (longitudinal bar resistance) \u2014 approximately 25 percent of Vc", "OptionD": "All three mechanisms are equally affected by corrosion", "CorrectAnswer": "C", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-04T07:56:47.380Z"}, {"QuestionID": "Q178315180757068264", "Question": "According to ACI 318-19 Clause 9.4.3 where is the critical section for shear located in a non-prestressed member with direct bearing support?", "OptionA": "At the face of the support where shear force is maximum", "OptionB": "At mid-span where moment is maximum", "OptionC": "At distance d from the face of the support", "OptionD": "At d/2 from the face of the support", "CorrectAnswer": "C", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-04T07:56:47.570Z"}, {"QuestionID": "Q178315180776470890", "Question": "For our running pier after 20 years of corrosion (r = 0.08 mm/yr) what are the corroded Vc and Vs values and what is phiVn?", "OptionA": "Vc = 106.0 kN and Vs = 90.3 kN and phiVn = 147.2 kN", "OptionB": "Vc = 95.4 kN and Vs = 41.7 kN and phiVn = 102.8 kN", "OptionC": "Vc = 95.4 kN and Vs = 90.3 kN and phiVn = 139.5 kN", "OptionD": "Vc = 106.0 kN and Vs = 41.7 kN and phiVn = 110.8 kN", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-04T07:56:47.764Z"}, {"QuestionID": "Q178315180797317225", "Question": "The original pier has stirrup spacing s = 300 mm with d = 415 mm. What does ACI 318 Limit 2 require and what is the verdict?", "OptionA": "s must not exceed d/4 = 103.75 mm \u2014 spacing violation", "OptionB": "s must not exceed d/2 = 207.5 mm \u2014 the provided 300 mm violates this limit", "OptionC": "s must not exceed 600 mm \u2014 the provided 300 mm is acceptable", "OptionD": "s must not exceed d = 415 mm \u2014 the provided 300 mm is acceptable", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-04T07:56:47.973Z"}, {"QuestionID": "Q178427737678052296", "Question": "What is the typical initial prestress just after tensioning in prestressed concrete?", "OptionA": "0.6 x ultimate strength", "OptionB": "0.65 x ultimate strength", "OptionC": "0.7 x ultimate strength", "OptionD": "0.75 x ultimate strength", "CorrectAnswer": "C", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-17T08:36:16.780Z"}, {"QuestionID": "Q178427744584913475", "Question": "For a rectangular section of overall depth h, the kern distance measured from the centroid is:", "OptionA": "h/2", "OptionB": "h/6", "OptionC": "h/3", "OptionD": "h/4", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-17T08:37:25.850Z"}, {"QuestionID": "Q178427749496152216", "Question": "Typical total prestress losses, as a percentage of the initial prestress, for post-tensioned members are approximately:", "OptionA": "30\u201340%", "OptionB": "25\u201330%", "OptionC": "10\u201315%", "OptionD": "1\u20132%", "CorrectAnswer": "C", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-17T08:38:14.961Z"}, {"QuestionID": "Q178427756133952876", "Question": "Which prestress loss is unique to post-tensioned members and does not occur in pre-tensioned members?", "OptionA": "Elastic shortening", "OptionB": "Friction loss (due to duct curvature)", "OptionC": "Relaxation of steel", "OptionD": "Shrinkage of concrete", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-17T08:39:21.339Z"}, {"QuestionID": "Q178427761305967958", "Question": "In pre-tensioning, the prestressing tendons are:", "OptionA": "Tensioned after the concrete has hardened, using hydraulic jacks", "OptionB": "Tensioned before the concrete is cast, then released after curing to transfer compression", "OptionC": "Never tensioned; only passive reinforcement is used", "OptionD": "Grouted into ducts before any tensioning occurs", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-17T08:40:13.059Z"}, {"QuestionID": "Q178496752724315693", "Question": "In FRP flexural strengthening why is the initial strain ebi subtracted when computing the net FRP strain at failure?", "OptionA": "Because FRP loses some strain capacity during the curing process", "OptionB": "Because the substrate is already strained under existing loads when FRP is bonded so FRP starts from a non-zero strain baseline", "OptionC": "Because ACI 440.2R requires a 15% reduction in all FRP strains for safety", "OptionD": "Because FRP fibres are pre-tensioned before bonding to the concrete surface", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-25T08:18:47.243Z"}, {"QuestionID": "Q178496752740511830", "Question": "In the five-step ACI 440.2R flexural design loop what governs the effective FRP strain efe for externally bonded laminates?", "OptionA": "The full rupture strain efu with no cap applied", "OptionB": "The minimum of the debonding strain efd and 0.9 times efu", "OptionC": "The concrete crushing strain of 0.003 divided by the neutral axis depth", "OptionD": "The steel yield strain ey multiplied by the modular ratio Ef over Es", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-25T08:18:47.405Z"}, {"QuestionID": "Q178496752764990640", "Question": "For the corroded pier worked example using 2 plies of CFRP (tf = 0.165 mm/ply and Ef = 230000 MPa) what is the effective FRP stress ffe that governs design?", "OptionA": "2933 MPa (fibre rupture governs)", "OptionB": "1711 MPa (debonding governs with efe = 0.0074)", "OptionC": "920 MPa (shear strain cap of 0.004 governs)", "OptionD": "3450 MPa (full ultimate fibre strength with no reduction)", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-25T08:18:47.649Z"}, {"QuestionID": "Q178496752791975571", "Question": "After adding 2 CFRP plies to the corroded pier what is the resulting phiMn and does it satisfy the demand of Mu = 165 kNm?", "OptionA": "phiMn = 162.5 kNm \u2014 inadequate by 1.5%", "OptionB": "phiMn = 176.3 kNm \u2014 adequate with 6.9% margin", "OptionC": "phiMn = 195.9 kNm \u2014 adequate with 18.7% margin", "OptionD": "phiMn = 139.4 kNm \u2014 still inadequate requiring 4 plies", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-25T08:18:47.919Z"}, {"QuestionID": "Q178496752815428506", "Question": "Why does adding more plies beyond the optimal number give diminishing capacity gains in FRP flexural strengthening?", "OptionA": "Additional plies reduce the modulus of elasticity of the composite system", "OptionB": "The debonding strain efd decreases as n increases so each ply works at a lower stress", "OptionC": "More plies increase the depth of the neutral axis reducing the lever arm significantly", "OptionD": "Additional plies cause premature concrete crushing before the FRP is activated", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-25T08:18:48.154Z"}, {"QuestionID": "Q178496757348147986", "Question": "In the ACI 440.2R confinement formula f'cc = f'co + 3.3 times psi-f times ka times fl what does the lateral confining pressure fl depend on?", "OptionA": "The axial load on the column and the concrete compressive strength only", "OptionB": "The number of plies n and the FRP thickness tf and modulus Ef and effective hoop strain efe divided by column diameter D", "OptionC": "The stirrup yield strength and spacing divided by the gross section area", "OptionD": "The FRP rupture strain efu multiplied by the environmental factor CE only", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-25T08:19:33.481Z"}, {"QuestionID": "Q178496757363335529", "Question": "For a circular column (D = 400 mm and f'co = 25 MPa) wrapped with 3 CFRP plies (tf = 0.165 mm and Ef = 230000 MPa and CE = 0.85) what is the confined strength f'cc?", "OptionA": "25.0 MPa (no improvement for circular sections)", "OptionB": "29.5 MPa (10% increase for circular sections)", "OptionC": "37.5 MPa (approximately 50% increase)", "OptionD": "50.0 MPa (100% increase with full hoop strain)", "CorrectAnswer": "C", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-25T08:19:33.633Z"}, {"QuestionID": "Q178496757396158756", "Question": "For circular columns the shape efficiency factor ka equals 1.0. For rectangular columns ka is less than 1.0. Why?", "OptionA": "Rectangular columns have larger cross-sectional area so the same wrap provides less lateral pressure", "OptionB": "The FRP jacket only applies effective confinement near the rounded corners of a rectangular section so the central flat zones are less confined", "OptionC": "Rectangular columns have higher axial loads that counteract the confining pressure", "OptionD": "The environmental reduction factor CE is applied twice for rectangular sections per ACI 440.2R", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-25T08:19:33.961Z"}, {"QuestionID": "Q178496757443773716", "Question": "What is the primary advantage of Near Surface Mounted (NSM) FRP over externally bonded laminates for flexural strengthening?", "OptionA": "NSM uses lower modulus fibres that are more ductile than surface-bonded plies", "OptionB": "NSM bars are grouted into sawn slots providing superior bond so IC debonding rarely governs and fire impact and aesthetic performance are better", "OptionC": "NSM provides higher strain capacity because the fibres are oriented at 45 degrees to the beam axis", "OptionD": "NSM eliminates the need for epoxy primers and allows wet layup in humid conditions", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-25T08:19:34.437Z"}, {"QuestionID": "Q178496757467731849", "Question": "According to the lecture the ACI 440.2R design framework (check material properties then find governing strain then satisfy equilibrium then apply psi-f and phi) applies to which FRP applications?", "OptionA": "Flexural strengthening only as shear and confinement use completely different procedures", "OptionB": "Flexural and shear only as confinement is governed by a separate international standard", "OptionC": "Flexural strengthening and confinement and shear and NSM \u2014 all techniques share the same framework with only the equilibrium equation and governing limit changing", "OptionD": "Confinement and NSM only as flexural design was established before ACI 440 was published", "CorrectAnswer": "C", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-25T08:19:34.677Z"}, {"QuestionID": "Q178496777023857674", "Question": "In FRP shear strengthening why does a full wrap allow a higher effective strain (efe = 0.004) than a U-wrap?", "OptionA": "Full wraps use higher modulus carbon fibres than the glass fibres used for U-wraps", "OptionB": "A full wrap forms a closed hoop with no free ends so there is no debonding path and anchorage is complete", "OptionC": "Full wraps are applied with higher epoxy pressure which increases the bond strength at the interface", "OptionD": "The psi-f factor for full wraps is lower reducing the design strain requirement", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-25T08:22:50.238Z"}, {"QuestionID": "Q178496777035881922", "Question": "The FRP shear contribution equation is Vf = Afv times ffe times (sin-alpha + cos-alpha) times dfv divided by sf. For 90-degree hoop fibres (alpha = 90 deg) what does (sin-alpha + cos-alpha) equal?", "OptionA": "0", "OptionB": "0.707", "OptionC": "1", "OptionD": "1.414", "CorrectAnswer": "C", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-25T08:22:50.358Z"}, {"QuestionID": "Q178496777058767891", "Question": "In the kv chain for U-wrap and side-bonded schemes what physical phenomenon does the bond wedge length Le represent?", "OptionA": "The minimum lap splice length needed to develop the full FRP tensile force", "OptionB": "The effective anchorage length over which FRP bond stress transfers \u2014 longer Le means better anchored but also penalises shallow members through k2", "OptionC": "The maximum stirrup spacing allowed before the diagonal crack bypasses the FRP strip", "OptionD": "The development length of the longitudinal steel bars at the beam support", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-25T08:22:50.587Z"}, {"QuestionID": "Q178496777079549048", "Question": "For the corroded pier shear worked example using full-wrap CFRP strips (wf = 100 mm at sf = 200 mm and 1 ply and ffe = 920 MPa) what is Vf and the rehabilitated phiVn?", "OptionA": "Vf = 43.0 kN and phiVn = 135.1 kN", "OptionB": "Vf = 63.0 kN and phiVn = 147.7 kN", "OptionC": "Vf = 90.3 kN and phiVn = 172.8 kN", "OptionD": "Vf = 106.0 kN and phiVn = 196.9 kN", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-25T08:22:50.795Z"}, {"QuestionID": "Q17849677710154947", "Question": "Why does the CFRP shear wrap adds capacity but does not restore the lost steel contribution Vs?", "OptionA": "The FRP fibres are oriented perpendicular to the stirrups so they carry a different load path", "OptionB": "ACI 440.2R prohibits counting FRP and steel stirrups simultaneously in the same shear calculation", "OptionC": "The corroded Vc and Vs values are retained in the calculation \u2014 the wrap increases the total Vn but future stirrup corrosion will still erode the reserve margin", "OptionD": "The psi-f factor of 0.95 already accounts for the reduced steel contribution in corroded sections", "CorrectAnswer": "C", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-25T08:22:51.015Z"}, {"QuestionID": "Q178496843619032144", "Question": "A structural engineer says the strongest FRP system is always the best choice for flexural rehabilitation. Is this correct and why?", "OptionA": "Yes \u2014 higher FRP strength always means higher phiMn so more plies are always better", "OptionB": "No \u2014 the best system is one that fails in a safe ductile and predictable manner not necessarily the strongest one", "OptionC": "Yes \u2014 but only if the FRP modulus is matched to the concrete grade", "OptionD": "No \u2014 because stronger FRP systems always debond before reaching useful strain", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-25T08:33:56.190Z"}, {"QuestionID": "Q178496856565216973", "Question": "Why must a continuous FRP wrap be treated with caution from a durability inspection standpoint even though it provides the maximum Vf?", "OptionA": "Continuous wraps crack under thermal cycling reducing their long-term effectiveness", "OptionB": "Continuous wraps trap moisture against the concrete surface and hide the substrate from visual inspection for new cracks or corrosion", "OptionC": "Continuous wraps violate ACI 440.2R spacing limits and are not permitted for shear applications", "OptionD": "Continuous wraps apply compression to the section which reduces the net tensile capacity of the FRP", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-25T08:36:05.652Z"}, {"QuestionID": "Q178548625323027698", "Question": "What is the key difference between a flat plate and a flat slab?", "OptionA": "A flat plate has perimeter beams; a flat slab does not", "OptionB": "A flat slab has drop panels or column capitals for added strength; a flat plate does not", "OptionC": "A flat plate carries load in one direction only", "OptionD": "A flat slab cannot be supported directly on columns", "CorrectAnswer": "B", "NegativeMarks": "0", "DefaultMarks": "2", "DateAdded": "2026-07-31T08:24:13.230Z"}, function log(t){const el=document.getElementById('log');el.textContent+=new Date().toLocaleTimeString()+' '+t+'\n';el.scrollTop=el.scrollHeight;}
function setStatus(type,text){document.getElementById('status').className='msg '+type;document.getElementById('status').textContent=text;}
function setProgress(v){document.getElementById('prog').value=v;}
function waitFb(){return new Promise(r=>{if(window._fbReady){r();return;}window.addEventListener('fb-ready',r,{once:true});setTimeout(r,5000);});}

async function runMigration() {
  document.getElementById('btn').disabled = true;
  document.getElementById('btn').textContent = 'Running...';
  await waitFb();
  const {doc, setDoc, addDoc, collection} = window._fns;
  const db = window._db;
  const total = QB.length + ES.length + EQ.length + ER.length;
  let done = 0;

  // Question Bank
  log('Writing ' + QB.length + ' questions to Question Bank...');
  for (const q of QB) {
    await setDoc(doc(db,'questionBank',q.QuestionID), {
      question: q.Question||'', optionA: q.OptionA||'', optionB: q.OptionB||'',
      optionC: q.OptionC||'', optionD: q.OptionD||'', correctAnswer: q.CorrectAnswer||'A',
      negativeMarks: Number(q.NegativeMarks||0), defaultMarks: Number(q.DefaultMarks||1),
      dateAdded: q.DateAdded||new Date().toISOString()
    });
    done++; setProgress(Math.round(done/total*100));
  }
  log('✓ ' + QB.length + ' questions written.');

  // Exam Sessions
  log('Writing ' + ES.length + ' exam sessions...');
  for (const ex of ES) {
    await setDoc(doc(db,'examSessions',ex.ExamID), {
      examId: ex.ExamID, examName: ex.ExamName||'',
      university: ex.University||'', course: ex.Course||'',
      sections: ex.Sections||'', duration: ex.Duration||'20',
      startTime: ex.StartTime||'', endTime: ex.EndTime||'',
      active: ex.Active||'NO', published: ex.Published||'NO',
      questionSetIDs: ex.QuestionSetIDs||'',
      createdAt: new Date().toISOString()
    });
    done++; setProgress(Math.round(done/total*100));
  }
  log('✓ ' + ES.length + ' exam sessions written.');

  // Exam Questions
  log('Writing ' + EQ.length + ' exam question links...');
  for (let i=0; i<EQ.length; i++) {
    const q = EQ[i];
    await setDoc(doc(db,'examQuestions',q.ExamID+'_Q'+q.QuestionNo), {
      examId: q.ExamID, questionNo: Number(q.QuestionNo||i+1),
      questionId: q.QuestionID||'',
      marks: Number(q.Marks||1), negativeMarks: Number(q.NegativeMarks||0)
    });
    done++; setProgress(Math.round(done/total*100));
  }
  log('✓ ' + EQ.length + ' exam question links written.');

  // Exam Responses
  log('Writing ' + ER.length + ' exam responses...');
  for (const r of ER) {
    await addDoc(collection(db,'examResponses'), {
      timestamp: r.Timestamp||new Date().toISOString(),
      examId: r.ExamID||'', university: r.University||'',
      course: r.Course||'', section: r.Section||'',
      studentId: r.StudentID||'', name: r.Name||'',
      answers: r.Answers||'',
      score: Number(r.Score||0), totalMarks: Number(r.TotalMarks||0),
      status: r.Status||'submitted'
    });
    done++; setProgress(Math.round(done/total*100));
    if(done%10===0) log('  '+done+'/'+total+' done...');
  }
  log('✓ ' + ER.length + ' exam responses written.');

  setProgress(100);
  setStatus('ok','✅ Migration complete! 87 questions + 7 exams + 60 links + 110 responses are now in Firebase.');
  log('\n✅ ALL DONE! Close this page and open the main app.');
  document.getElementById('btn').textContent = '✅ Done';
}
